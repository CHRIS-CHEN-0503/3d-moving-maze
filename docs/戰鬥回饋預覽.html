<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>倒轉高塔 · 戰鬥光影音效預覽</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08131f;color:#e9f1f5;font-family:system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}small{color:#cbaa73;letter-spacing:.1em}h1{font-size:28px;margin:6px 0 14px}p{line-height:1.7;color:#b8c9d7;margin:0 0 16px}#stage{width:100%;height:min(52vh,490px);min-height:230px;display:block;border:1px solid #52697d;border-radius:16px;background:#111f2a}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}button{cursor:pointer;color:inherit;background:#152c3b;border:1px solid #577185;border-radius:12px;min-height:50px;padding:12px;text-align:left;font-size:17px}button[aria-pressed=true]{border-color:#f1cc88;background:#2d3d42;box-shadow:inset 0 0 0 1px #f1cc88}button small{display:block;margin-top:5px;letter-spacing:0;color:#b6d2e2;font-size:13px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}#play{min-width:150px;text-align:center}#caption{color:#f3dba9}footer{color:#7e99ac;font-size:13px;line-height:1.6;margin-top:18px}@media(max-height:500px){main{padding:10px 18px}h1{font-size:22px;margin:3px 0}header p{display:none}#stage{height:48vh;min-height:155px}.choices{margin-top:8px;gap:8px}button{padding:8px;min-height:44px;font-size:15px}.controls{margin-top:8px}footer{margin-top:8px;font-size:11px}}@media(max-width:600px){main{padding:12px}h1{font-size:23px}.choices{gap:6px}button{font-size:15px}button small{font-size:12px}#stage{height:40vh}}
</style></head><body><main><header><div><small>倒轉高塔 · 實際特效模組</small><h1>命中與施放，聽見每個動作</h1><p>點擊技能或命中按鈕，播放實際遊戲使用的光影與音效。此頁不影響存檔。</p></div></header><canvas id="stage" aria-label="迷宮技能光影動畫"></canvas><nav class="choices" id="choices"></nav><div class="controls"><button id="play">繼續自動展示</button><button id="physical">物理命中</button><button id="magical">法術命中</button><label>其他技能 <select id="other" aria-label="選擇其他技能"></select></label><label><input type="checkbox" id="sound" checked>音效</label><span id="caption" role="status"></span></div><footer>與遊戲共用技能特效程式；展示場景僅供看清光影，不會改動存檔。輕量幾何、局部光暈；無額外即時陰影或全螢幕濾鏡。</footer></main>
<script src="../assets/combat-audio.js?v=1.59.0"></script><script src="../lib/three.min.js"></script><script src="../story/tower-ascension-catalog.js?v=1.46.0"></script><script src="../story/tower-gear-tiers.js?v=1.46.0"></script><script src="../story/tower-hero-growth.js"></script><script src="../story/tower-heroes-core.js"></script><script src="../story/tower-skill-effects.js?v=1.59.0"></script>
<script>
const T=THREE,skills=['wind_slash','starfall','barrier'].map(id=>TowerHeroes.SKILLS[id]),canvas=document.getElementById('stage'),scene=new T.Scene();
scene.background=new T.Color(0x12202c);scene.fog=new T.Fog(0x12202c,16,35);
const renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;
const camera=new T.PerspectiveCamera(42,2,.1,50);camera.position.set(8,8,12);camera.lookAt(0,.8,0);scene.add(new T.HemisphereLight(0xd8efff,0x293540,1.05));const sun=new T.DirectionalLight(0xffdfaf,.8);sun.position.set(3,9,4);scene.add(sun);
const stone=new T.MeshLambertMaterial({color:0x526474}),floor=new T.Mesh(new T.BoxGeometry(15,.2,12),new T.MeshLambertMaterial({color:0x263d4d}));floor.position.y=-.1;scene.add(floor);
for(let z=-5;z<=5;z+=1.5)for(let x=-7;x<=7;x+=1.5){const tile=new T.Mesh(new T.BoxGeometry(1.46,.04,1.46),new T.MeshLambertMaterial({color:(x+z)%3===0?0x385363:0x304957}));tile.position.set(x,.01,z);scene.add(tile);}
for(let y=.5;y<3;y+=.7)for(let x=-7;x<8;x+=1.2){const brick=new T.Mesh(new T.BoxGeometry(1.17,.66,.65),stone);brick.position.set(x+(y<1?0:.4),y,-4.6);scene.add(brick);}
const hero=new T.Group(),skin=new T.MeshLambertMaterial({color:0xe4bc8b}),cloth=new T.MeshLambertMaterial({color:0x477daa}),dark=new T.MeshLambertMaterial({color:0x253444});
function box(w,h,d,x,y,z,mat){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);hero.add(m);return m;}
box(.54,.75,.33,0,.88,0,cloth);box(.42,.45,.4,0,1.49,0,skin);box(.46,.12,.43,0,1.75,0,dark);box(.19,.55,.24,-.17,.27,0,dark);box(.19,.55,.24,.17,.27,0,dark);box(.15,.56,.2,-.39,.99,0,skin);const arm=box(.15,.56,.2,.39,.99,0,skin);scene.add(hero);
const fx=TowerSkillEffects.create(T,{world:()=>scene,limit:12,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});
let audioContext,sounds;function sound(kind,seconds){if(!document.getElementById("sound").checked)return;audioContext ||= new (window.AudioContext||window.webkitAudioContext)();if(!sounds){const gain=audioContext.createGain();gain.gain.value=.55;gain.connect(audioContext.destination);sounds=CombatAudio.create(audioContext,gain);}audioContext.resume();sounds.play(kind,seconds);}
let delayed=null;
let chosen=0,automatic=false,last=performance.now(),since=0,castTime=0;
const descriptions=['金色刀光與破風斬擊','蓄能、落點與轟擊聲','環繞護盾與共鳴聲'];
const choices=document.getElementById('choices');skills.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML=s.name+'<small>'+descriptions[i]+'</small>';b.onclick=()=>show(i);choices.appendChild(b);});
function show(i){chosen=i;since=castTime=0;delayed=null;fx.reset();hero.rotation.y=.2;const s=skills[i];present(s);document.getElementById('caption').textContent=s.name+' · '+descriptions[i];[...choices.children].forEach((b,k)=>b.setAttribute('aria-pressed',String(k===i)));}
function present(s){delayed=null;fx.reset();sounds?.stop();const seconds=TowerHeroes.preparationSeconds(s.id),aimed=['starfall','star_ring','decisive'].includes(s.effect);if(seconds){fx.emit(s,{x:0,z:0},.2,{stage:'charge',duration:seconds});if(aimed)fx.emit(s,{x:0,z:2},.2,{duration:seconds});sound('charge',seconds);delayed={skill:s,left:seconds,aimed};}else{fx.emit(s,{x:0,z:0},.2);sound(CombatAudio.skillKind(s));}}
const other=document.getElementById('other');other.innerHTML='<option value="">請選技能</option>'+Object.values(TowerHeroes.SKILLS).map(s=>'<option value="'+s.id+'">'+s.name+'</option>').join('');other.onchange=()=>{const s=TowerHeroes.SKILLS[other.value];if(s){automatic=false;document.getElementById('play').textContent='繼續自動展示';present(s);document.getElementById('caption').textContent=s.name;}};
function contact(magic){delayed=null;automatic=false;document.getElementById('play').textContent='繼續自動展示';fx.reset();fx.emit(magic?TowerHeroes.SKILLS.arcane_bolt:TowerHeroes.SKILLS.wind_slash,{x:0,z:1.5},.2,{impact:true,weapon:magic?'staff':'blade'});sound(magic?'hit-magic':'hit-metal');document.getElementById('caption').textContent=magic?'法術命中迸光':'物理命中斬痕';}
document.getElementById('physical').onclick=()=>contact(false);document.getElementById('magical').onclick=()=>contact(true);
document.getElementById('sound').onchange=()=>sounds?.stop();document.addEventListener('visibilitychange',()=>{if(document.hidden){automatic=false;delayed=null;sounds?.stop();}});
document.getElementById('play').onclick=()=>{automatic=!automatic;document.getElementById('play').textContent=automatic?'暫停自動展示':'繼續自動展示';};
const resize=()=>{const rect=canvas.getBoundingClientRect();renderer.setSize(rect.width,rect.height,false);camera.aspect=rect.width/rect.height;camera.updateProjectionMatrix();};new ResizeObserver(resize).observe(canvas);resize();document.getElementById("sound").checked=false;show(0);document.getElementById("sound").checked=true;
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;since+=dt;castTime+=dt;if(delayed&&(delayed.left-=dt)<=0){const {skill,aimed}=delayed;fx.emit(skill,{x:0,z:aimed?2:0},0,aimed?{stage:'land'}:{});sound(aimed?'burst':CombatAudio.skillKind(skill));delayed=null;}if(automatic&&since>2.5)show((chosen+1)%3);fx.tick(dt);arm.rotation.x=chosen===0&&castTime<.8?-Math.sin(castTime/.8*Math.PI)*1.4:0;renderer.render(scene,camera);requestAnimationFrame(tick);}requestAnimationFrame(tick);
window.skillPreview={show,stats:fx.stats,skills:skills.map(s=>s.id)};
</script></body></html>
