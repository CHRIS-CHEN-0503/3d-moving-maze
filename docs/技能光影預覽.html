<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>倒轉高塔 · 技能光影預覽</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08131f;color:#e9f1f5;font-family:system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}small{color:#cbaa73;letter-spacing:.1em}h1{font-size:28px;margin:6px 0 14px}p{line-height:1.7;color:#b8c9d7;margin:0 0 16px}#stage{width:100%;height:min(52vh,490px);min-height:230px;display:block;border:1px solid #52697d;border-radius:16px;background:#111f2a}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}button{cursor:pointer;color:inherit;background:#152c3b;border:1px solid #577185;border-radius:12px;min-height:50px;padding:12px;text-align:left;font-size:17px}button[aria-pressed=true]{border-color:#f1cc88;background:#2d3d42;box-shadow:inset 0 0 0 1px #f1cc88}button small{display:block;margin-top:5px;letter-spacing:0;color:#b6d2e2;font-size:13px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}#play{min-width:150px;text-align:center}#caption{color:#f3dba9}footer{color:#7e99ac;font-size:13px;line-height:1.6;margin-top:18px}@media(max-height:500px){main{padding:10px 18px}h1{font-size:22px;margin:3px 0}header p{display:none}#stage{height:48vh;min-height:155px}.choices{margin-top:8px;gap:8px}button{padding:8px;min-height:44px;font-size:15px}.controls{margin-top:8px}footer{margin-top:8px;font-size:11px}}@media(max-width:600px){main{padding:12px}h1{font-size:23px}.choices{gap:6px}button{font-size:15px}button small{font-size:12px}#stage{height:40vh}}
</style></head><body><main><header><div><small>倒轉高塔 · 實際特效模組</small><h1>三個技能，三種光影</h1><p>本次隨機抽選：近戰、範圍法術、照明。點擊任一技能可重播。</p></div></header><canvas id="stage" aria-label="迷宮技能光影動畫"></canvas><nav class="choices" id="choices"></nav><div class="controls"><button id="play">暫停自動展示</button><span id="caption" role="status"></span></div><footer>與遊戲共用技能特效程式；展示場景僅供看清光影，不會改動存檔。輕量幾何、局部光暈；無額外即時陰影或全螢幕濾鏡。</footer></main>
<script src="../lib/three.min.js"></script><script src="../story/tower-ascension-catalog.js?v=1.46.0"></script><script src="../story/tower-gear-tiers.js?v=1.46.0"></script><script src="../story/tower-hero-growth.js"></script><script src="../story/tower-heroes-core.js"></script><script src="../story/tower-skill-effects.js"></script>
<script>
const T=THREE,skills=['wind_slash','thunder_wave','daylight'].map(id=>TowerHeroes.SKILLS[id]),canvas=document.getElementById('stage'),scene=new T.Scene();
scene.background=new T.Color(0x12202c);scene.fog=new T.Fog(0x12202c,16,35);
const renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;
const camera=new T.PerspectiveCamera(42,2,.1,50);camera.position.set(8,8,12);camera.lookAt(0,.8,0);scene.add(new T.HemisphereLight(0xd8efff,0x293540,1.05));const sun=new T.DirectionalLight(0xffdfaf,.8);sun.position.set(3,9,4);scene.add(sun);
const stone=new T.MeshLambertMaterial({color:0x526474}),floor=new T.Mesh(new T.BoxGeometry(15,.2,12),new T.MeshLambertMaterial({color:0x263d4d}));floor.position.y=-.1;scene.add(floor);
for(let z=-5;z<=5;z+=1.5)for(let x=-7;x<=7;x+=1.5){const tile=new T.Mesh(new T.BoxGeometry(1.46,.04,1.46),new T.MeshLambertMaterial({color:(x+z)%3===0?0x385363:0x304957}));tile.position.set(x,.01,z);scene.add(tile);}
for(let y=.5;y<3;y+=.7)for(let x=-7;x<8;x+=1.2){const brick=new T.Mesh(new T.BoxGeometry(1.17,.66,.65),stone);brick.position.set(x+(y<1?0:.4),y,-4.6);scene.add(brick);}
const hero=new T.Group(),skin=new T.MeshLambertMaterial({color:0xe4bc8b}),cloth=new T.MeshLambertMaterial({color:0x477daa}),dark=new T.MeshLambertMaterial({color:0x253444});
function box(w,h,d,x,y,z,mat){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);hero.add(m);return m;}
box(.54,.75,.33,0,.88,0,cloth);box(.42,.45,.4,0,1.49,0,skin);box(.46,.12,.43,0,1.75,0,dark);box(.19,.55,.24,-.17,.27,0,dark);box(.19,.55,.24,.17,.27,0,dark);box(.15,.56,.2,-.39,.99,0,skin);const arm=box(.15,.56,.2,.39,.99,0,skin);scene.add(hero);
const fx=TowerSkillEffects.create(T,{world:()=>scene,limit:12,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});
let chosen=0,automatic=true,last=performance.now(),since=0,castTime=0;
const descriptions=['金色扇形刀光、飛散火花','紫色震波、電光與擴散光環','升起光球、環繞星點與暖色光暈'];
const choices=document.getElementById('choices');skills.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML=s.name+'<small>'+descriptions[i]+'</small>';b.onclick=()=>show(i);choices.appendChild(b);});
function show(i){chosen=i;since=castTime=0;fx.reset();hero.rotation.y=.2;const s=skills[i];fx.emit(s,{x:0,z:0},.2);document.getElementById('caption').textContent=s.name+' · '+descriptions[i];[...choices.children].forEach((b,k)=>b.setAttribute('aria-pressed',String(k===i)));}
document.getElementById('play').onclick=()=>{automatic=!automatic;document.getElementById('play').textContent=automatic?'暫停自動展示':'繼續自動展示';};
const resize=()=>{const rect=canvas.getBoundingClientRect();renderer.setSize(rect.width,rect.height,false);camera.aspect=rect.width/rect.height;camera.updateProjectionMatrix();};new ResizeObserver(resize).observe(canvas);resize();show(0);
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;since+=dt;castTime+=dt;if(automatic&&since>2.5)show((chosen+1)%3);fx.tick(dt);arm.rotation.x=chosen===0&&castTime<.8?-Math.sin(castTime/.8*Math.PI)*1.4:0;renderer.render(scene,camera);requestAnimationFrame(tick);}requestAnimationFrame(tick);
window.skillPreview={show,stats:fx.stats,skills:skills.map(s=>s.id)};
</script></body></html>
