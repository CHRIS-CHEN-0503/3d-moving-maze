<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>倒轉高塔 · 八職業技能光影預覽</title>
<style>
:root{color-scheme:dark;--gold:#edc989;--muted:#aac1ce}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 45% 0,#203c4d,#08131f 70%);color:#edf3f5;font-family:system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:14px}small{color:var(--gold);letter-spacing:.08em}h1{font-size:28px;margin:5px 0 8px}p{line-height:1.6;color:var(--muted);margin:0 0 12px}#count{white-space:nowrap;border:1px solid #516674;border-radius:999px;padding:8px 12px;color:var(--gold);font-size:14px}.stage-wrap{position:relative}#stage{width:100%;height:min(48vh,455px);min-height:230px;display:block;border:1px solid #52697d;border-radius:16px;background:#111f2a}.stage-note{position:absolute;left:14px;bottom:12px;font-size:12px;color:#bdcbd2;padding:5px 9px;border-radius:8px;background:#08131fb8;pointer-events:none}.choices{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin-top:12px}button,select{font:inherit;font-size:15px;color:inherit;background:#152c3b;border:1px solid #577185;border-radius:10px;min-height:44px}button{cursor:pointer;padding:8px;text-align:left;touch-action:manipulation}button:hover,select:hover{border-color:#adc6d4}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}button[aria-pressed=true]{border-color:var(--gold);background:#2d3d42;box-shadow:inset 0 0 0 1px var(--gold)}.job-top{display:flex;align-items:center;gap:5px}.job-top .hero-icon{width:26px;height:26px;flex:none}.job-name{font-weight:650;font-size:15px}.representative{display:block;margin-top:3px;letter-spacing:0;color:#b6d2e2;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:12px}.field{display:grid;gap:4px;color:var(--muted);font-size:12px;min-width:170px;flex:1}.field select{width:100%;padding:8px 28px 8px 10px;cursor:pointer}.controls button{text-align:center;min-width:86px}#auto-label{display:flex;align-items:center;gap:7px;min-height:44px;font-size:14px;color:var(--muted)}input[type=checkbox]{width:21px;height:21px;margin:0;accent-color:#dabb7a}#caption{margin:12px 0 4px;color:#f3dba9;font-size:18px;min-height:1.4em}#description{font-size:14px;min-height:1.6em;margin-bottom:4px}.fine-print{font-size:12px;color:#8ea8b9;line-height:1.6;margin:8px 0 0}#error{color:#ffd9ba}footer{border-top:1px solid #314b5c;margin-top:12px;padding-top:10px;color:#8ea8b9;font-size:12px;line-height:1.6}a{color:#c4dfef}button:disabled{opacity:.55;cursor:default}@media(max-width:750px){main{padding:12px}.choices{grid-template-columns:repeat(4,minmax(0,1fr))}h1{font-size:23px}.field{min-width:135px}#stage{height:38vh}#count{font-size:12px;padding:7px 9px}}@media(max-height:500px) and (orientation:landscape){main{padding:9px 16px}h1{font-size:21px;margin:2px 0 5px}header p{display:none}header small{font-size:11px}#stage{height:46vh;min-height:150px}.choices{grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;margin-top:7px}.job-top{gap:3px;justify-content:center}.job-top .hero-icon{width:21px;height:21px}.job-name{font-size:13px}.representative{font-size:11px;text-align:center}button{padding:5px}.controls{margin-top:7px;gap:7px}.controls button{min-width:68px}.field{min-width:150px;font-size:11px;gap:2px}.stage-note{bottom:8px;left:10px;font-size:10px}#caption{font-size:16px;margin-top:8px}#description{font-size:12px}.fine-print,footer{font-size:11px}}@media(max-width:620px) and (max-height:500px) and (orientation:landscape){.job-top{flex-direction:column;gap:0}.representative{display:none}.field{min-width:130px}#auto-label{font-size:12px}.controls{gap:6px}#count{display:none}}
</style></head><body><main><header><div><small>倒轉高塔 · 遊戲共用光影</small><h1>八職業技能光影預覽</h1><p>選擇職業代表招式，或從清單查看該職業的全部主動技能。</p></div><span id="count">載入技能中</span></header>
<div class="stage-wrap"><canvas id="stage" aria-label="技能光影與中立靶柱展示"></canvas><span class="stage-note">中立光影舞台 · 靶柱不是角色造型</span></div>
<nav class="choices" id="choices" aria-label="八職業代表技能"></nav>
<div class="controls"><label class="field" for="skill-select"><span id="select-label">職業技能</span><select id="skill-select" aria-label="選擇技能"></select></label><button id="replay" type="button">重新播放</button><button id="play" type="button" aria-pressed="false">暫停動畫</button><label id="auto-label"><input id="auto" type="checkbox">輪播八職業</label></div>
<h2 id="caption" role="status" aria-live="polite"></h2><p id="description"></p><p class="fine-print">此頁僅預覽施放光影，並非傷害、技能持續時間或人物動作模擬；目前靜音，不消耗材料。</p><p id="error" role="alert" hidden></p>
<footer>使用遊戲相同的技能資料、專有圖示與光影程式。無額外即時陰影、全螢幕閃光或外部圖片；支援裝置的減少動態設定，不會讀寫遊戲存檔。<a href="職業裝備圖鑑.html">查看劇情模式圖鑑</a></footer></main>
<script src="../lib/three.min.js"></script><script src="../story/tower-robot-core.js?v=1.58.0"></script><script src="../story/tower-ascension-catalog.js?v=1.57.2"></script><script src="../story/tower-gear-tiers.js?v=1.54.0"></script><script src="../story/tower-hero-growth.js?v=1.58.0"></script><script src="../story/tower-heroes-core.js?v=1.58.2"></script><script src="../story/tower-heroes-icons.js?v=1.54.0"></script><script src="../story/tower-skill-effects.js?v=1.58.2"></script>
<script>
(()=>{'use strict';
const T=THREE,H=TowerHeroes,all=Object.values(H.SKILLS),jobs=Object.keys(H.JOBS),representative={swordsman:'wind_slash',mage:'thunder_wave',scout:'smoke',chef:'soup_splash',healer:'herbal_heal',smith:'hammer_bash',archer:'arrow_volley',robot:'flying_fist'},canvas=document.getElementById('stage'),scene=new T.Scene(),owned=new Set();
const choices=document.getElementById('choices'),select=document.getElementById('skill-select'),play=document.getElementById('play'),auto=document.getElementById('auto'),caption=document.getElementById('caption'),description=document.getElementById('description');
document.getElementById('count').textContent=jobs.length+' 職業 · '+all.length+' 招';
let renderer;try{renderer=new T.WebGLRenderer({canvas,antialias:true});}catch{const error=document.getElementById('error');error.hidden=false;error.textContent='此裝置暫時無法啟用立體光影，請確認瀏覽器的硬體加速設定後重新開啟。';document.getElementById('replay').disabled=play.disabled=select.disabled=true;return;}
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;scene.background=new T.Color(0x11232f);scene.fog=new T.Fog(0x11232f,15,32);
const camera=new T.PerspectiveCamera(42,2,.1,50);camera.position.set(7.8,6.9,10.5);camera.lookAt(0,.85,.7);scene.add(new T.HemisphereLight(0xd8efff,0x243441,1.05));const sun=new T.DirectionalLight(0xffdfaf,.65);sun.position.set(3,9,4);scene.add(sun);
// The same single, permanent flash slot the story floors use: dark when idle, lit where a skill lands.
const flashLight=new T.PointLight(0xffffff,0,8,1.6);flashLight.name='preview-skill-flash';scene.add(flashLight);let flashLeft=0,flashTotal=0,flashPower=0;
function flash(at,color,power,seconds){const current=flashTotal>0?flashPower*Math.pow(flashLeft/flashTotal,2):0;if(current>power)return false;flashLight.position.set(at.x,at.y??1.4,at.z);flashLight.color.setHex(color);flashLight.distance=Math.min(12,6+power*1.2);flashPower=power;flashTotal=flashLeft=seconds;flashLight.intensity=power;return true;}
function decayFlash(dt){if(flashLeft<=0)return;flashLeft=Math.max(0,flashLeft-dt);flashLight.intensity=flashLeft>0?flashPower*Math.pow(flashLeft/flashTotal,2):0;}
const material=color=>{const mat=new T.MeshLambertMaterial({color});owned.add(mat);return mat;},stone=material(0x536877),trim=material(0x9f936f),ground=material(0x263d4d);
function mesh(geometry,mat,x,y,z){owned.add(geometry);const part=new T.Mesh(geometry,mat);part.position.set(x,y,z);scene.add(part);return part;}
mesh(new T.BoxGeometry(15,.2,12),ground,0,-.16,0);mesh(new T.CylinderGeometry(3.9,4.05,.1,48),stone,0,-.045,.5);
// A deliberately neutral practice target avoids implying that these simple
// shapes represent the game's authored professions or their actual attacks.
mesh(new T.CylinderGeometry(.28,.38,1.35,12),stone,0,.675,2.05);mesh(new T.CylinderGeometry(.34,.34,.1,16),trim,0,1.4,2.05);mesh(new T.CylinderGeometry(.48,.54,.15,16),trim,0,.075,2.05);
for(const side of [-1,1]){mesh(new T.BoxGeometry(.32,.38,7),ground,side*4.7,.11,-.3);mesh(new T.BoxGeometry(.38,.07,7.05),trim,side*4.7,.32,-.3);}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,fx=TowerSkillEffects.create(T,{world:()=>scene,limit:12,reducedMotion:reduced,flash});
let chosen=all.find(skill=>skill.id===representative.swordsman)||all[0],paused=false,active=true,last=performance.now(),elapsed=0,raf=0;
for(const job of jobs){const def=H.JOBS[job],skill=H.SKILLS[representative[job]]||all.find(row=>row.job===job),button=document.createElement('button');button.type='button';button.dataset.job=job;button.setAttribute('aria-label',def.name+'：'+skill.name);const top=document.createElement('span');top.className='job-top';top.innerHTML=TowerHeroIcons.svg(skill.id);const name=document.createElement('span');name.className='job-name';name.textContent=def.name;top.appendChild(name);const label=document.createElement('small');label.className='representative';label.textContent=skill.name;button.append(top,label);button.addEventListener('click',()=>selectSkill(skill.id));choices.appendChild(button);}
function refreshSkills(job){select.replaceChildren();for(const skill of all.filter(row=>row.job===job)){const option=document.createElement('option');option.value=skill.id;option.textContent=skill.name+(skill.ascension?' · 地下進階':skill.unique?' · 獨有':'');select.appendChild(option);}document.getElementById('select-label').textContent=H.JOBS[job].name+' · '+select.options.length+' 種技能';}
function updatePlay(){play.textContent=paused?'繼續動畫':'暫停動畫';play.setAttribute('aria-pressed',String(paused));}
function replay(){if(!active)return false;elapsed=0;paused=false;last=performance.now();fx.reset();flashLeft=0;flashLight.intensity=0;fx.emit(chosen,{x:0,z:0},0);fx.tick(.012);updatePlay();return true;}
function selectSkill(id){const skill=H.SKILLS[id];if(!skill)return false;if(!select.options.length||chosen.job!==skill.job)refreshSkills(skill.job);chosen=skill;select.value=id;caption.textContent=H.JOBS[skill.job].name+' · '+skill.name;description.textContent=skill.description;for(const button of choices.children)button.setAttribute('aria-pressed',String(button.dataset.job===skill.job));return replay();}
function show(value){const skill=typeof value==='number'?all[value]:H.SKILLS[value];return skill?selectSkill(skill.id):false;}
select.addEventListener('change',()=>selectSkill(select.value));document.getElementById('replay').addEventListener('click',replay);play.addEventListener('click',()=>{paused=!paused;last=performance.now();updatePlay();});auto.addEventListener('change',()=>{elapsed=0;});
function resize(){if(!active)return;const rect=canvas.getBoundingClientRect();renderer.setSize(Math.max(1,rect.width),Math.max(1,rect.height),false);camera.aspect=Math.max(1,rect.width)/Math.max(1,rect.height);camera.updateProjectionMatrix();}
const observer=new ResizeObserver(resize);observer.observe(canvas);resize();selectSkill(chosen.id);
function tick(now){if(!active)return;const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;if(!paused&&!document.hidden){elapsed+=dt;fx.tick(dt);decayFlash(dt);if(auto.checked&&elapsed>3.2){const next=jobs[(jobs.indexOf(chosen.job)+1)%jobs.length];selectSkill(representative[next]);}}renderer.render(scene,camera);raf=requestAnimationFrame(tick);}raf=requestAnimationFrame(tick);
function visibility(){last=performance.now();}document.addEventListener('visibilitychange',visibility);window.addEventListener('pageshow',visibility);
function destroy(){if(!active)return false;active=false;cancelAnimationFrame(raf);observer.disconnect();document.removeEventListener('visibilitychange',visibility);window.removeEventListener('pageshow',visibility);fx.destroy();for(const resource of owned)resource.dispose();owned.clear();scene.clear();renderer.dispose();return true;}
window.addEventListener('pagehide',event=>{if(!event.persisted)destroy();});
window.skillPreview=Object.freeze({show,selectSkill,replay,stats:fx.stats,destroy,skills:Object.freeze(all.map(skill=>skill.id)),representatives:Object.freeze({...representative}),get current(){return chosen.id;},get paused(){return paused;},get reducedMotion(){return reduced;}});
})();
</script></body></html>
